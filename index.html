<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test - Speed Test Your WPM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            background-color: #0f0f0f;
            color: #d4d4d4;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-theme {
            background-color: #f5f5f5;
            color: #2a2a2a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        body.light-theme .header {
            border-bottom-color: #ddd;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid #404040;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        body.light-theme .theme-toggle {
            border-color: #ccc;
            color: #2a2a2a;
        }

        .theme-toggle:hover {
            background-color: #1a1a1a;
        }

        body.light-theme .theme-toggle:hover {
            background-color: #e8e8e8;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid #404040;
            background-color: #1a1a1a;
            color: #d4d4d4;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.2s;
        }

        body.light-theme .btn {
            border-color: #ccc;
            background-color: #fff;
            color: #2a2a2a;
        }

        .btn:hover {
            background-color: #2a2a2a;
            color: #fff;
        }

        body.light-theme .btn:hover {
            background-color: #f0f0f0;
        }

        .btn.active {
            background-color: #646695;
            color: #fff;
            border-color: #646695;
        }

        .btn.new-words {
            margin-left: auto;
        }

        .main-section {
            width: 100%;
            max-width: 900px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 4px;
            text-align: center;
        }

        body.light-theme .stats-bar {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
        }

        .stat {
            flex: 1;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #00d9a3;
        }

        body.light-theme .stat-value {
            color: #00b893;
        }

        .typing-area {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 4px;
            margin-bottom: 30px;
            min-height: 200px;
            position: relative;
            overflow: hidden;
        }

        body.light-theme .typing-area {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
        }

        .words-display {
            font-size: 24px;
            line-height: 1.8;
            color: #666;
            word-spacing: 15px;
            position: relative;
        }

        body.light-theme .words-display {
            color: #aaa;
        }

        .word {
            display: inline-block;
            margin-right: 10px;
            position: relative;
        }

        .letter {
            position: relative;
        }

        .letter.correct {
            color: #00d9a3;
        }

        .letter.incorrect {
            color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.2);
        }

        .letter.cursor {
            background-color: #646695;
            color: #fff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        .cursor-line {
            position: absolute;
            left: 0;
            top: 0;
            width: 2px;
            height: 30px;
            background-color: #646695;
            animation: blink 1s infinite;
        }

        .timer-display {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #00d9a3;
        }

        body.light-theme .timer-display {
            border-color: #ddd;
        }

        .timer-display.warning {
            color: #ff9500;
            border-color: #ff9500;
        }

        .timer-display.danger {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .results-overlay.show {
            display: flex;
        }

        .results-card {
            background-color: #1a1a1a;
            padding: 50px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
        }

        body.light-theme .results-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
        }

        .results-wpm {
            font-size: 80px;
            font-weight: 700;
            color: #00d9a3;
            margin-bottom: 20px;
        }

        .results-grade {
            display: inline-block;
            font-size: 48px;
            font-weight: 700;
            color: #646695;
            margin-bottom: 30px;
            padding: 10px 20px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }

        body.light-theme .results-grade {
            background-color: #f0f0f0;
            color: #646695;
        }

        .results-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            padding: 20px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        body.light-theme .results-stats {
            border-color: #ddd;
        }

        .results-stat {
            padding: 10px;
        }

        .results-stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .results-stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #d4d4d4;
        }

        body.light-theme .results-stat-value {
            color: #2a2a2a;
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .results-btn {
            padding: 12px 24px;
            border: 1px solid #404040;
            background-color: #2a2a2a;
            color: #d4d4d4;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.2s;
        }

        body.light-theme .results-btn {
            background-color: #f0f0f0;
            border-color: #ddd;
            color: #2a2a2a;
        }

        .results-btn:hover {
            background-color: #3a3a3a;
            color: #00d9a3;
        }

        body.light-theme .results-btn:hover {
            background-color: #e0e0e0;
        }

        .history-section {
            width: 100%;
            max-width: 900px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #333;
        }

        body.light-theme .history-section {
            border-top-color: #ddd;
        }

        .history-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .history-table thead {
            border-bottom: 1px solid #333;
        }

        body.light-theme .history-table thead {
            border-bottom-color: #ddd;
        }

        .history-table th {
            padding: 10px 0;
            text-align: left;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .history-table td {
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            color: #d4d4d4;
        }

        body.light-theme .history-table td {
            border-bottom-color: #e0e0e0;
            color: #2a2a2a;
        }

        .history-table td:first-child {
            color: #00d9a3;
        }

        .history-empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .help-text {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 12px;
        }

        body.light-theme .help-text {
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .title {
                font-size: 20px;
            }

            .controls {
                gap: 10px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .stats-bar {
                padding: 15px;
                gap: 10px;
            }

            .stat-value {
                font-size: 24px;
            }

            .typing-area {
                padding: 20px;
                min-height: 150px;
            }

            .words-display {
                font-size: 18px;
                line-height: 1.6;
                word-spacing: 10px;
            }

            .timer-display {
                width: 60px;
                height: 60px;
                font-size: 24px;
                right: 10px;
                top: 10px;
            }

            .results-card {
                padding: 30px 20px;
            }

            .results-wpm {
                font-size: 60px;
            }

            .results-grade {
                font-size: 36px;
            }

            .results-stats {
                grid-template-columns: 1fr;
            }

            .history-table {
                font-size: 12px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">typing test</div>
            <button class="theme-toggle" onclick="toggleTheme()">light</button>
        </div>

        <div class="controls">
            <button class="btn active" onclick="setTimer(15)">15s</button>
            <button class="btn" onclick="setTimer(30)">30s</button>
            <button class="btn" onclick="setTimer(60)">60s</button>
            <button class="btn" onclick="setTimer(120)">120s</button>
            <button class="btn new-words" onclick="generateNewWords()">new words</button>
        </div>

        <div class="main-section">
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-label">wpm</div>
                    <div class="stat-value" id="wpmDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">accuracy</div>
                    <div class="stat-value" id="accuracyDisplay">100%</div>
                </div>
                <div class="stat">
                    <div class="stat-label">errors</div>
                    <div class="stat-value" id="errorsDisplay">0</div>
                </div>
            </div>

            <div class="typing-area">
                <div class="words-display" id="wordsDisplay"></div>
                <div class="timer-display" id="timerDisplay">15</div>
            </div>

            <div class="help-text" id="helpText">click to start</div>
        </div>

        <div class="history-section">
            <div class="history-title">history</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>wpm</th>
                        <th>accuracy</th>
                        <th>errors</th>
                        <th>grade</th>
                        <th>time</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="5" class="history-empty">no tests yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="results-overlay" id="resultsOverlay">
        <div class="results-card">
            <div id="resultsGrade" class="results-grade">S</div>
            <div class="results-wpm" id="resultsWpm">0</div>
            <div style="margin-bottom: 20px; color: #888;">words per minute</div>
            
            <div class="results-stats">
                <div class="results-stat">
                    <div class="results-stat-label">accuracy</div>
                    <div class="results-stat-value" id="resultsAccuracy">100%</div>
                </div>
                <div class="results-stat">
                    <div class="results-stat-label">errors</div>
                    <div class="results-stat-value" id="resultsErrors">0</div>
                </div>
                <div class="results-stat">
                    <div class="results-stat-label">correct words</div>
                    <div class="results-stat-value" id="resultsCorrectWords">0</div>
                </div>
                <div class="results-stat">
                    <div class="results-stat-label">time</div>
                    <div class="results-stat-value" id="resultsTime">15s</div>
                </div>
            </div>

            <div class="results-actions">
                <button class="results-btn" onclick="restartTest()">restart</button>
                <button class="results-btn" onclick="newTestWithWords()">new words</button>
            </div>
        </div>
    </div>

    <script>
        // Word bank
        const WORDS = [
            'the', 'be', 'to', 'of', 'and', 'a', 'in', 'that', 'have', 'i', 'it', 'for', 'not', 'on', 'with', 'he', 'as', 'you', 'do', 'at',
            'this', 'but', 'his', 'by', 'from', 'they', 'we', 'say', 'her', 'she', 'or', 'an', 'will', 'my', 'one', 'all', 'would', 'there', 'their', 'what',
            'so', 'up', 'out', 'if', 'about', 'who', 'get', 'which', 'go', 'me', 'when', 'make', 'can', 'like', 'time', 'no', 'just', 'him', 'know', 'take',
            'people', 'into', 'year', 'your', 'good', 'some', 'could', 'them', 'see', 'other', 'than', 'then', 'now', 'look', 'only', 'come', 'its', 'over', 'think', 'also',
            'back', 'after', 'use', 'two', 'how', 'our', 'work', 'first', 'well', 'way', 'even', 'new', 'want', 'because', 'any', 'these', 'give', 'day', 'most', 'us',
            'is', 'was', 'are', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should', 'may', 'might', 'must', 'can', 'shall',
            'typing', 'test', 'speed', 'words', 'type', 'fast', 'slow', 'easy', 'hard', 'practice', 'skill', 'improve', 'challenge', 'game', 'fun',
            'computer', 'keyboard', 'screen', 'monitor', 'mouse', 'desk', 'office', 'home', 'work', 'internet', 'online', 'web', 'site', 'page', 'link',
            'coding', 'program', 'software', 'data', 'code', 'script', 'server', 'client', 'network', 'system', 'process', 'function', 'variable', 'constant', 'string',
            'music', 'song', 'sound', 'audio', 'video', 'movie', 'film', 'show', 'play', 'watch', 'listen', 'hear', 'read', 'write', 'book',
            'cat', 'dog', 'bird', 'fish', 'animal', 'nature', 'forest', 'tree', 'flower', 'plant', 'grass', 'ground', 'water', 'rain', 'sun',
            'car', 'bike', 'truck', 'bus', 'train', 'plane', 'boat', 'ship', 'travel', 'journey', 'trip', 'road', 'street', 'path', 'walk',
            'food', 'eat', 'drink', 'cook', 'meal', 'breakfast', 'lunch', 'dinner', 'fruit', 'vegetable', 'bread', 'meat', 'fish', 'rice', 'pasta',
            'person', 'man', 'woman', 'child', 'boy', 'girl', 'family', 'mother', 'father', 'brother', 'sister', 'friend', 'teacher', 'student', 'doctor',
            'school', 'class', 'learn', 'teach', 'study', 'book', 'paper', 'pencil', 'pen', 'desk', 'chair', 'table', 'room', 'building', 'house',
            'color', 'red', 'blue', 'green', 'yellow', 'black', 'white', 'gray', 'orange', 'purple', 'pink', 'brown', 'gold', 'silver', 'dark',
            'number', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'hundred', 'thousand', 'million', 'billion',
            'weather', 'hot', 'cold', 'warm', 'cool', 'sunny', 'cloudy', 'rainy', 'snowy', 'windy', 'storm', 'snow', 'ice', 'frost', 'freeze',
            'sport', 'game', 'play', 'team', 'win', 'lose', 'score', 'ball', 'bat', 'run', 'jump', 'kick', 'throw', 'catch', 'football'
        ];

        // State
        let currentWords = [];
        let typedLetters = [];
        let currentWordIndex = 0;
        let currentLetterIndex = 0;
        let timerDuration = 15;
        let timeRemaining = 15;
        let isRunning = false;
        let hasStarted = false;
        let timerInterval = null;
        let totalErrors = 0;
        let correctWords = 0;
        let testStartTime = null;

        // Initialize
        function init() {
            generateNewWords();
            renderWords();
            loadTheme();
            loadHistory();
        }

        // Generate random words
        function generateNewWords() {
            currentWords = [];
            for (let i = 0; i < 200; i++) {
                currentWords.push(WORDS[Math.floor(Math.random() * WORDS.length)]);
            }
            resetTyping();
        }

        // Reset typing state
        function resetTyping() {
            typedLetters = [];
            currentWordIndex = 0;
            currentLetterIndex = 0;
            totalErrors = 0;
            correctWords = 0;
            isRunning = false;
            hasStarted = false;
            timeRemaining = timerDuration;
            testStartTime = null;
            clearInterval(timerInterval);
            updateStats();
            renderWords();
            document.getElementById('helpText').textContent = 'click to start';
            document.getElementById('timerDisplay').textContent = timerDuration;
            document.getElementById('timerDisplay').classList.remove('warning', 'danger');
        }

        // Render words
        function renderWords() {
            const display = document.getElementById('wordsDisplay');
            display.innerHTML = '';
            
            currentWords.forEach((word, wordIdx) => {
                const wordEl = document.createElement('div');
                wordEl.className = 'word';
                wordEl.id = `word-${wordIdx}`;
                
                for (let letterIdx = 0; letterIdx < word.length; letterIdx++) {
                    const letterEl = document.createElement('span');
                    letterEl.className = 'letter';
                    letterEl.textContent = word[letterIdx];
                    letterEl.id = `letter-${wordIdx}-${letterIdx}`;
                    
                    // Determine letter state
                    if (wordIdx < currentWordIndex) {
                        // Previous word - check if all correct
                        if (typedLetters[wordIdx] && typedLetters[wordIdx][letterIdx] === word[letterIdx]) {
                            letterEl.classList.add('correct');
                        } else if (typedLetters[wordIdx] && typedLetters[wordIdx][letterIdx]) {
                            letterEl.classList.add('incorrect');
                        }
                    } else if (wordIdx === currentWordIndex) {
                        // Current word
                        if (letterIdx < currentLetterIndex) {
                            if (typedLetters[wordIdx] && typedLetters[wordIdx][letterIdx] === word[letterIdx]) {
                                letterEl.classList.add('correct');
                            } else if (typedLetters[wordIdx] && typedLetters[wordIdx][letterIdx]) {
                                letterEl.classList.add('incorrect');
                            }
                        } else if (letterIdx === currentLetterIndex && isRunning) {
                            letterEl.classList.add('cursor');
                        }
                    }
                    
                    wordEl.appendChild(letterEl);
                }
                
                display.appendChild(wordEl);
            });

            // Auto-scroll
            const currentWordEl = document.getElementById(`word-${currentWordIndex}`);
            if (currentWordEl) {
                currentWordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Update stats
        function updateStats() {
            let totalChars = 0;
            let correctChars = 0;
            
            for (let i = 0; i < currentWordIndex; i++) {
                if (typedLetters[i]) {
                    totalChars += Math.max(typedLetters[i].length, currentWords[i].length);
                    for (let j = 0; j < Math.min(typedLetters[i].length, currentWords[i].length); j++) {
                        if (typedLetters[i][j] === currentWords[i][j]) {
                            correctChars++;
                        }
                    }
                }
            }

            if (isRunning && currentLetterIndex > 0) {
                totalChars += Math.max(typedLetters[currentWordIndex]?.length || 0, currentLetterIndex);
                const currentWord = currentWords[currentWordIndex];
                if (typedLetters[currentWordIndex]) {
                    for (let j = 0; j < Math.min(typedLetters[currentWordIndex].length, currentLetterIndex); j++) {
                        if (typedLetters[currentWordIndex][j] === currentWord[j]) {
                            correctChars++;
                        }
                    }
                }
            }

            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const elapsedTime = testStartTime ? (timerDuration - timeRemaining) / 60 : 0;
            const wpm = elapsedTime > 0 ? Math.round(correctChars / 5 / elapsedTime) : 0;

            document.getElementById('wpmDisplay').textContent = wpm;
            document.getElementById('accuracyDisplay').textContent = accuracy + '%';
            document.getElementById('errorsDisplay').textContent = totalErrors;
        }

        // Start timer
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            hasStarted = true;
            testStartTime = Date.now();
            document.getElementById('helpText').classList.add('hidden');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                document.getElementById('timerDisplay').textContent = timeRemaining;
                
                const timerEl = document.getElementById('timerDisplay');
                if (timeRemaining <= 5 && timeRemaining > 3) {
                    timerEl.classList.add('warning');
                } else if (timeRemaining <= 3) {
                    timerEl.classList.add('danger');
                }

                updateStats();

                if (timeRemaining <= 0) {
                    finishTest();
                }
            }, 1000);
        }

        // Finish test
        function finishTest() {
            isRunning = false;
            clearInterval(timerInterval);

            let totalChars = 0;
            let correctChars = 0;
            
            for (let i = 0; i <= currentWordIndex; i++) {
                if (typedLetters[i]) {
                    const wordLength = currentWords[i].length;
                    totalChars += Math.max(typedLetters[i].length, wordLength);
                    for (let j = 0; j < Math.min(typedLetters[i].length, wordLength); j++) {
                        if (typedLetters[i][j] === currentWords[i][j]) {
                            correctChars++;
                        }
                    }
                }
            }

            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const wpm = Math.round(correctChars / 5 / (timerDuration / 60));
            const grade = getGrade(wpm);

            // Count correct words
            let correctWordsCount = 0;
            for (let i = 0; i <= currentWordIndex; i++) {
                if (typedLetters[i] && typedLetters[i].join('') === currentWords[i]) {
                    correctWordsCount++;
                }
            }

            // Save to history
            saveToHistory({
                wpm,
                accuracy,
                errors: totalErrors,
                grade,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            // Show results
            showResults({
                wpm,
                accuracy,
                errors: totalErrors,
                correctWords: correctWordsCount,
                grade,
                time: timerDuration + 's'
            });
        }

        // Get grade based on WPM
        function getGrade(wpm) {
            if (wpm >= 100) return 'S';
            if (wpm >= 80) return 'A';
            if (wpm >= 60) return 'B';
            if (wpm >= 40) return 'C';
            return 'D';
        }

        // Show results
        function showResults(data) {
            document.getElementById('resultsWpm').textContent = data.wpm;
            document.getElementById('resultsAccuracy').textContent = data.accuracy + '%';
            document.getElementById('resultsErrors').textContent = data.errors;
            document.getElementById('resultsCorrectWords').textContent = data.correctWords;
            document.getElementById('resultsGrade').textContent = data.grade;
            document.getElementById('resultsTime').textContent = data.time;
            document.getElementById('resultsOverlay').classList.add('show');
        }

        // Save to history
        function saveToHistory(result) {
            let history = JSON.parse(localStorage.getItem('typingHistory')) || [];
            history.unshift(result);
            history = history.slice(0, 10);
            localStorage.setItem('typingHistory', JSON.stringify(history));
            loadHistory();
        }

        // Load history
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('typingHistory')) || [];
            const tbody = document.getElementById('historyBody');
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="history-empty">no tests yet</td></tr>';
                return;
            }

            tbody.innerHTML = history.map(result => `
                <tr>
                    <td>${result.wpm}</td>
                    <td>${result.accuracy}%</td>
                    <td>${result.errors}</td>
                    <td>${result.grade}</td>
                    <td>${result.timestamp}</td>
                </tr>
            `).join('');
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            // Tab to restart
            if (e.key === 'Tab') {
                e.preventDefault();
                restartTest();
                return;
            }

            if (!hasStarted && e.key !== 'Tab') {
                startTimer();
            }

            if (!isRunning) return;

            const currentWord = currentWords[currentWordIndex];

            if (e.key === ' ') {
                e.preventDefault();
                // Complete word
                typedLetters[currentWordIndex] = typedLetters[currentWordIndex] || [];
                const typedWord = typedLetters[currentWordIndex].join('');
                
                if (typedWord === currentWord) {
                    correctWords++;
                }

                // Check for extra letters
                if (typedLetters[currentWordIndex].length > currentWord.length) {
                    totalErrors += typedLetters[currentWordIndex].length - currentWord.length;
                }

                currentWordIndex++;
                currentLetterIndex = 0;

                if (currentWordIndex >= currentWords.length) {
                    currentWords = currentWords.concat(generateMoreWords());
                }

                renderWords();
                updateStats();
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                
                if (currentLetterIndex === 0) {
                    if (currentWordIndex > 0) {
                        currentWordIndex--;
                        currentLetterIndex = (typedLetters[currentWordIndex]?.length || 0);
                    }
                } else {
                    typedLetters[currentWordIndex] = typedLetters[currentWordIndex] || [];
                    typedLetters[currentWordIndex].pop();
                    currentLetterIndex--;
                    totalErrors++;
                }

                renderWords();
                updateStats();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                
                typedLetters[currentWordIndex] = typedLetters[currentWordIndex] || [];
                typedLetters[currentWordIndex].push(e.key);
                currentLetterIndex++;

                const word = currentWords[currentWordIndex];
                if (currentLetterIndex > 0) {
                    const typedChar = typedLetters[currentWordIndex][currentLetterIndex - 1];
                    if (typedChar !== word[currentLetterIndex - 1]) {
                        totalErrors++;
                    }
                }

                renderWords();
                updateStats();
            }
        });

        document.getElementById('wordsDisplay').addEventListener('click', () => {
            if (!hasStarted) {
                startTimer();
            }
        });

        // Set timer
        function setTimer(duration) {
            timerDuration = duration;
            timeRemaining = duration;
            
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            resetTyping();
            document.getElementById('timerDisplay').textContent = duration;
        }

        // Theme toggle
        function toggleTheme() {
            const isDark = document.body.classList.toggle('light-theme');
            document.querySelector('.theme-toggle').textContent = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load theme
        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.body.classList.add('light-theme');
                document.querySelector('.theme-toggle').textContent = 'dark';
            }
        }

        // Generate more words
        function generateMoreWords() {
            const words = [];
            for (let i = 0; i < 50; i++) {
                words.push(WORDS[Math.floor(Math.random() * WORDS.length)]);
            }
            return words;
        }

        // Restart test
        function restartTest() {
            document.getElementById('resultsOverlay').classList.remove('show');
            resetTyping();
        }

        // New test with new words
        function newTestWithWords() {
            document.getElementById('resultsOverlay').classList.remove('show');
            generateNewWords();
            resetTyping();
        }

        // Initialize app
        init();
    </script>
</body>
</html>
